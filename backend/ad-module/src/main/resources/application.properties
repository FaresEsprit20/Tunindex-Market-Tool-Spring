# ========================
# AD MODULE
# ========================
spring.application.name=ad-module
server.port=8090

# ========================
# DATABASE
# ========================
# PostgreSQL, matching the collector and api services. Ad events are
# append-only and high volume - one row per impression - so they get their own
# database rather than sharing the api's: a burst of ad traffic should not sit
# in the way of someone loading their portfolio.
spring.datasource.url=jdbc:postgresql://localhost:5432/tunindex-ads
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Eureka Service Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

internal.api.key=market-tool-internal-secret-key-2026

# ========================
# WATCH-TO-UNLOCK
# ========================
# Signs the grant that says an ad was watched. The gateway verifies grants
# with the same key, so the two values MUST match - a mismatch refuses every
# grant and leaves every gated feature shut.
#
# Set AD_GRANT_SECRET in any real environment. A signing key committed to a
# repository signs nothing: anyone who can read it can mint their own grants
# and skip every ad.
ads.grant.secret=${AD_GRANT_SECRET:tunindex-dev-ad-grant-secret-change-me}

# ========================
# LOGGING
# ========================
logging.level.com.tunindex.market_tool.ads=INFO
