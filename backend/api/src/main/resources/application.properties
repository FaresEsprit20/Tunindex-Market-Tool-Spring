spring.application.name=api-service
server.port=8082

# Internal API Key for calling Collector service (must match collector's key)
internal.api.key=market-tool-internal-secret-key-2026

# Mailing service URL for internal communication
mailing.service.url=http://mailing-service

# Recaptcha service URL
recaptcha.service.url=http://recaptcha-service

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/tunindex-api
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Password Reset - Use relative path (not full URL)
app.reset-url=/api/v1/password-reset/verify

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Eureka Service Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Google Recaptcha v3
recaptcha.site-key=6LeiiU0rAAAAAKs_QaJjbyQnFAznRuacFNNTZkdW
recaptcha.secret-key=6LeiiU0rAAAAALRFpiuf39dWbfKK03FnhCO0U5Jm
recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify
recaptcha.score-threshold=0.7
recaptcha.allowed-hostnames=localhost,127.0.0.1
recaptcha.project-id=recaptcha-trial-1748452820567

# ============================================================
# GOOGLE OAUTH 2.0 CONFIGURATION - FIXED
# ============================================================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8082/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=email,profile,openid

# Google Provider Configuration
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

# Security
application.security.ip-salt=${IP_SALT:d6f644b79a844c8a9b32f12e4a7c8d1e5f309a8714b247d5c12e8a7d6f4b29a}
application.security.trusted-proxies=${TRUSTED_PROXIES:}

# OAuth2 Success URL (your endpoint)
app.oauth2.success-url=/oauth2/success

# Logging
logging.level.com.tunindex.market_tool.common=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG