spring.application.name=api-service
server.port=8082

# Internal API Key for calling Collector service (must match collector's key)
internal.api.key=market-tool-internal-secret-key-2026

# Mailing service URL for internal communication
mailing.service.url=http://mailing-service

# Recaptcha service URL
recaptcha.service.url=http://recaptcha-service

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/tunindex-api
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Password Reset - Use relative path (not full URL)
app.reset-url=/api/v1/password-reset/verify

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Eureka Service Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Google Recaptcha v3
recaptcha.site-key=6LeiiU0rAAAAAKs_QaJjbyQnFAznRuacFNNTZkdW
recaptcha.secret-key=6LeiiU0rAAAAALRFpiuf39dWbfKK03FnhCO0U5Jm
recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify
recaptcha.score-threshold=0.7
recaptcha.allowed-hostnames=localhost,127.0.0.1
recaptcha.project-id=recaptcha-trial-1748452820567

# ============================================================
# GOOGLE OAUTH 2.0 CONFIGURATION - FIXED
# ============================================================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8082/login/oauth2/code/google

# Google Provider Configuration
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

# Security
application.security.ip-salt=${IP_SALT:d6f644b79a844c8a9b32f12e4a7c8d1e5f309a8714b247d5c12e8a7d6f4b29a}
application.security.trusted-proxies=${TRUSTED_PROXIES:}

# OAuth2 Success URL — the Angular app's callback route, not this server.
# OAuth2LoginSuccessHandler appends ?accessToken=&refreshToken= and
# redirects the whole browser here once Google auth completes.
app.oauth2.success-url=http://localhost:4200/auth/oauth-callback

# Logging
logging.level.com.tunindex.market_tool.common=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG

# Rate limiting.
#
# The defaults in RateLimitingFilter (10/s) predate the dashboard: a single
# SPA page load legitimately fans out to a dozen endpoints at once — the grid,
# sparklines, watchlist, session, breadth, unusual activity, notifications and
# the price stream — so 10/s classified normal use as abuse and returned 429
# for the price stream, which silently killed live quotes.
#
# 50/s absorbs that burst; 600/min still caps sustained traffic at 10/s, so
# scraping and credential stuffing are no better off than before.
security.rate-limit.second=50
security.rate-limit.minute=600

# Connection pool.
#
# The Hikari default of 10 was set before this service ran three scheduled
# jobs (alert evaluation, watchlist monitoring, price streaming) alongside
# ordinary request traffic, and the pool emptied under a burst of
# notifications. 20 gives those jobs headroom without being generous.
#
# leak-detection-threshold is the important line: it logs a stack trace for
# any connection held longer than 20s, which is how a future "Connection is
# not available" gets diagnosed in seconds instead of by bisecting services.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.leak-detection-threshold=20000
