# ========================
# COLLECTOR SERVICE CONFIGURATION
# ========================
spring.application.name=collector-service
server.port=8081

# Internal API Key for service-to-service communication
internal.api.key=market-tool-internal-secret-key-2026
# ========================
# ACTIVE PROVIDER
# ========================
market-tool.provider.active=stockanalysis

# Force using IPv4 (helps with VPN routing)
java.net.preferIPv4Stack=true
# Force Java to use system proxy settings
java.net.useSystemProxies=true

# ========================
# DATABASE
# ========================
# PostgreSQL, not H2. Beyond being the production target, persistence is what
# the collector depends on: re-fetching a year of daily bars for ~70 symbols
# takes about twenty minutes and has to stay slow to stay polite, and until it
# finishes, average volume, one-year return and beta are all blank because the
# bars they are computed from are gone. The schema already existed here.
spring.datasource.url=jdbc:postgresql://localhost:5432/tunindex-collector
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Eureka Service Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# ========================
# SCRAPING SETTINGS
# ========================
# Fetch strategy — see PageFetcher.
#
# Both sources currently answer a plain HTTP GET in well under a second with
# the markup we parse, so HTTP is the default path and a browser is only used
# if a host actually starts refusing us.
#
# browser-fallback-enabled is OFF deliberately. When it was on and the block
# detector produced a false positive, one bad reading marked the whole host as
# browser-required and the next pipeline pass — three pages across seventy-odd
# symbols — tried to launch roughly two hundred Chrome instances. Turn this on
# only when a site has genuinely started blocking, and watch the first pass.
market-tool.scraping.browser-fallback-enabled=false

# Hard ceiling on Chrome launches per hour, whatever else goes wrong.
market-tool.scraping.browser-launches-per-hour=12

# Per-host pacing, plus jitter — evenly spaced requests are themselves a
# recognisable automation signature, and volume is what actually gets a
# scraper banned.
market-tool.scraping.host-delay-ms=1200
market-tool.scraping.jitter-ms=800
market-tool.scraping.http-timeout-seconds=30

# Per-host gaps, where one interval does not suit every publisher. Yahoo's
# chart API 429s a burst but is content at ~6s between calls; the throttling
# seen in testing was self-inflicted, not a block.
#
# stockanalysis.com is paced further apart than the default because it is the
# heaviest consumer here: three pages per symbol across seventy-odd symbols is
# well over two hundred requests per run, and at the default gap a sustained
# session ended with it refusing forty of seventy-three. The extra second per
# request costs a few minutes on a run that already takes minutes, and buys
# back the failures.
market-tool.scraping.host-delays=query1.finance.yahoo.com=6000,stockanalysis.com=2500
market-tool.scraping.data-retry-attempts=3
market-tool.scraping.rate-limit-backoff-ms=4000

# How long a host stays on the browser path after a genuine refusal, before
# the cheap path is retried. A block is usually a bad hour, not a verdict.
market-tool.scraping.browser-fallback-minutes=30

market-tool.scraping.use-browser=true
market-tool.scraping.request-timeout=60
market-tool.scraping.retry-count=3
market-tool.scraping.rate-limit-delay=3000
market-tool.scraping.retry-delay=1000

# ========================
# PROXY SETTINGS
# ========================
#market-tool.scraping.use-proxy=false
#market-tool.proxy.auto-load=true
#market-tool.proxy.api-url=https://www.proxy-list.download/api/v1/get?type=http
#market-tool.proxy.validation-timeout=10000

# ========================
# STEALTH SETTINGS
# ========================
market-tool.stealth.enabled=true
market-tool.stealth.rotate-user-agent=true
market-tool.stealth.rotate-fingerprint=true
market-tool.stealth.detect-captcha=true
market-tool.stealth.user-agent-file=stealth/user-agents.txt
market-tool.stealth.fingerprint-file=stealth/browser-profiles.json

# ========================
# RETRY SETTINGS
# ========================
market-tool.retry.max-attempts=3
market-tool.retry.initial-delay-ms=1000
market-tool.retry.max-delay-ms=10000
market-tool.retry.multiplier=2.0

# ========================
# RATE LIMIT SETTINGS
# ========================
market-tool.rate-limit.enabled=true
market-tool.rate-limit.delay-ms=1500
market-tool.rate-limit.requests-per-minute=40
market-tool.rate-limit.requests-per-hour=240

# ========================
# CACHE SETTINGS
# ========================
market-tool.cache.ttl=3600

# ========================
# PARALLELISM SETTINGS
# ========================
market-tool.parallelism.max-workers=10
market-tool.parallelism.bvps-skip-if-exists=true

# ========================
# WEB CLIENT SETTINGS
# ========================
spring.webflux.client.read-timeout=30000
spring.webflux.client.connect-timeout=10000

# ========================
# INVESTING.COM SETTINGS
# ========================
investingcom.base-url=https://www.investing.com
investingcom.rate-limit-per-minute=10
investingcom.timeout=30000

# ========================
# STOCKANALYSIS.COM SETTINGS
# ========================
stockanalysis.base-url=https://stockanalysis.com
stockanalysis.timeout=30000

# ========================
# OWNERSHIP MAPPING
# ========================
market-tool.ownership.government=STB,BH,BNA
market-tool.ownership.mixed=BIAT,UIB,ATB,UBCI

# ========================
# SCHEDULER SETTINGS
# ========================
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=scheduler-

# Scheduler Configuration
# The collector no longer scrapes automatically on boot — trigger a run via
# POST /internal/pipeline/start (proxied through the api service), which also
# arms the recurring scheduler below for subsequent automatic updates.
market-tool.scheduler.interval-minutes=30
market-tool.scheduler.run-on-startup=false
market-tool.scheduler.initial-delay-seconds=2

# ========================
# LOGGING
# ========================
logging.level.com.tunindex.market_tool=DEBUG
logging.level.com.tunindex.market_tool.common=DEBUG
logging.level.com.tunindex.market_tool.client=DEBUG
logging.level.com.tunindex.market_tool.service.stealth=DEBUG
logging.level.org.springframework.web.reactive.function.client=WARN

# ========================
# ADDED STEALTH SCRAPER CONFIG
# ========================
scraper.proxy.enabled=false
scraper.proxy.host=127.0.0.1
scraper.proxy.port=8080
scraper.proxy.username=
scraper.proxy.password=
scraper.throttling.requests-per-second=2.0
scraper.throttling.max-concurrent=5
scraper.retry.max-attempts=3
scraper.retry.initial-delay=2s
scraper.retry.max-delay=30s


# ========================
# BROWSER SETTINGS
# ========================
market-tool.browser.version=152
# One at a time: callers are sequential, and each extra permit is another few
# hundred megabytes of Chrome.
market-tool.browser.max-concurrent=1
market-tool.browser.page-load-timeout-seconds=45
market-tool.browser.quit-timeout-seconds=20

