# ========================
# MAILING SERVICE CONFIGURATION
# ========================
spring.application.name=mailing-service
server.port=8085

# ========================
# DATABASE
# ========================
# PostgreSQL, matching every other service.
#
# This was in-memory H2, which is the same as having no database at all for
# anything that has to outlive a restart - and this service issues password
# reset and email verification tokens. A deploy in the wrong minute invalidated
# every link already sitting in someone's inbox, and the user was told the link
# was invalid rather than that we had lost it.
spring.datasource.url=jdbc:postgresql://localhost:5432/tunindex-mailing
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================
# Eureka Service Discovery
# ========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ========================
# EMAIL CONFIGURATION
# ========================
# SMTP credentials come from backend/.env, which is gitignored.
#
# The app password used to sit in this file in plain text. This file is
# committed, so the password is in the repository's history and anyone with
# a copy of the repo has it - moving it here does not undo that. It has to
# be revoked and reissued in the Google account; see the note in .env.
#
# No defaults on the two secret values on purpose: a fallback would let the
# service start with the wrong credentials and fail later at send time, where
# the cause is much harder to see than a missing-property error at boot.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.from=${MAIL_FROM:${MAIL_USERNAME}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ========================
# INTERNAL API KEY
# ========================
internal.api.key=market-tool-internal-secret-key-2026

# Mailing service URL for internal communication
mailing.service.url=http://mailing-service

# ========================
# API SERVICE URL
# ========================
api.service.url=http://api-service

# ========================
# LOGGING
# ========================
logging.level.com.tunindex.market_tool.mailing=DEBUG

# ========================
# SWAGGER
# ========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
