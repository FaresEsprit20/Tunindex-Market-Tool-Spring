# ========================
# MAILING SERVICE CONFIGURATION
# ========================
spring.application.name=recaptcha-service
server.port=8087

# ========================
# DATABASE
# ========================
spring.datasource.url=jdbc:h2:mem:tunindex-recaptcha;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ========================
# Eureka Service Discovery
# ========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Google Recaptcha v3
recaptcha.site-key=6LeiiU0rAAAAAKs_QaJjbyQnFAznRuacFNNTZkdW
recaptcha.secret-key=6LeiiU0rAAAAALRFpiuf39dWbfKK03FnhCO0U5Jm
recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify
recaptcha.score-threshold=0.7
recaptcha.allowed-hostnames=localhost,127.0.0.1
recaptcha.project-id=recaptcha-trial-1748452820567

# ========================
# INTERNAL API KEY
# ========================
internal.api.key=market-tool-internal-secret-key-2026


# ========================
# LOGGING
# ========================
logging.level.com.tunindex.market_tool.mailing=DEBUG

# ========================
# SWAGGER
# ========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
