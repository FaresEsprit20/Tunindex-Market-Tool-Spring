# ========================
# MAILING SERVICE CONFIGURATION
# ========================
spring.application.name=recaptcha-service
# Moved off 8087, which the monitor service occupies - this one would simply
# fail to bind and the captcha checks would be unavailable with no obvious
# cause. Nothing addresses this service by host and port: the api service
# resolves it through discovery as http://recaptcha-service, so the number
# here is free to change.
server.port=8089

# ========================
# DATABASE
# ========================
# PostgreSQL, matching every other service. In-memory H2 discarded this
# service's records on every restart, which is the same as not keeping them.
spring.datasource.url=jdbc:postgresql://localhost:5432/tunindex-recaptcha
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================
# Eureka Service Discovery
# ========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Google Recaptcha v3
recaptcha.site-key=6LeiiU0rAAAAAKs_QaJjbyQnFAznRuacFNNTZkdW
recaptcha.secret-key=6LeiiU0rAAAAALRFpiuf39dWbfKK03FnhCO0U5Jm
recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify
recaptcha.score-threshold=0.7
recaptcha.allowed-hostnames=localhost,127.0.0.1
recaptcha.project-id=recaptcha-trial-1748452820567

# ========================
# INTERNAL API KEY
# ========================
internal.api.key=market-tool-internal-secret-key-2026


# ========================
# LOGGING
# ========================
logging.level.com.tunindex.market_tool.mailing=DEBUG

# ========================
# SWAGGER
# ========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
