# Static SPA host. The one thing that isn't default nginx behaviour is the
# try_files fallback below - without it, a hard refresh on any Angular route
# other than "/" (e.g. /app/opportunities) 404s at nginx before the Angular
# router ever gets a chance to handle it.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
