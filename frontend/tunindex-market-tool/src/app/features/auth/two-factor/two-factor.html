<app-card class="auth-card">
  <div class="panel-head icon-head">
    <div class="head-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"></path><path d="M9 12l2 2 4-4"></path></svg>
    </div>
    <div>
      <p class="panel-title">Verify it's you</p>
      <p class="panel-sub">Enter the 6-digit code from your authenticator app.</p>
    </div>
  </div>

  <div class="panel-body">
    @if (errorMessage()) {
      <p class="form-error">{{ errorMessage() }}</p>
    }

    <div class="otp-row" (paste)="onPaste($event)">
      @for (digit of digits(); track $index) {
        <input
          #digitInput
          class="otp-box"
          [class.filled]="digit"
          type="text"
          inputmode="numeric"
          maxlength="1"
          autocomplete="one-time-code"
          [value]="digit"
          (input)="onDigitInput($index, $event)"
          (keydown)="onDigitKeydown($index, $event)"
        />
      }
    </div>

    <div class="countdown-row">
      <span class="countdown-label">This login attempt expires in</span>
      <span class="countdown-value">{{ expiryLabel() }}</span>
    </div>

    <button type="button" class="btn btn-block btn-primary" [disabled]="submitting() || !isComplete()" (click)="onSubmit()">
      {{ submitting() ? 'Verifying…' : 'Verify code' }}
    </button>

    <p class="footnote"><a routerLink="/auth/login">Use a different account</a></p>
  </div>
</app-card>
