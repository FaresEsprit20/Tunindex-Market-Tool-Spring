<!-- Masthead: brand + search + utilities, then sections across the width.
     A finance site is read top-down from a header, not operated from a
     left rail — this is the structural difference from an admin console. -->
<header class="shell-masthead">
  <a class="shell-brand" routerLink="/app/dashboard">
    <span class="brand-dot"></span>
    <span class="brand-word">Tunindex</span>
  </a>
  <app-navbar />
</header>

<app-primary-nav />

<app-market-ticker />

<main class="shell-content">
  <router-outlet />
</main>

<app-command-palette />
