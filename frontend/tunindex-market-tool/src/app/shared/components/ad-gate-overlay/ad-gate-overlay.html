@if (challenge(); as gate) {
  <div class="gate-backdrop" role="dialog" aria-modal="true" aria-labelledby="gate-title">
    <div class="gate-panel">
      <div class="gate-head">
        <p class="gate-eyebrow">Sponsor message</p>
        <p class="gate-title" id="gate-title">{{ gate.featureLabel }}</p>
      </div>

      <div class="gate-creative">
        @if (gate.ad.creativeUrl) {
          <img [src]="gate.ad.creativeUrl" [alt]="gate.ad.altText ?? gate.ad.name" />
        } @else {
          <div class="gate-placeholder">{{ gate.ad.advertiser ?? gate.ad.name }}</div>
        }
      </div>

      <div class="gate-progress" aria-hidden="true">
        <span class="gate-progress-fill" [style.width.%]="progress()"></span>
      </div>

      <p class="gate-status" aria-live="polite">
        @if (claiming()) {
          Unlocking&hellip;
        } @else if (failed()) {
          Just a moment longer&hellip;
        } @else {
          Continues in {{ remaining() }}s
        }
      </p>

      <!-- No skip control: the server will not unlock before the ad's own
           duration has passed, so a skip button could only pretend. -->
      <button type="button" class="gate-cancel" (click)="cancel()">
        Not now &mdash; go back
      </button>
    </div>
  </div>
}
