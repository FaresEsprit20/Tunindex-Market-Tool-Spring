@if (ad(); as advert) {
  @switch (format()) {
    @case ('video') { <app-ad-video [ad]="advert" /> }
    @case ('native') { <app-ad-native [ad]="advert" /> }
    @case ('interstitial') { <app-ad-interstitial [ad]="advert" (closed)="onDismissed()" /> }
    @case ('banner') { <app-ad-banner [ad]="advert" /> }
    @case ('embed') {
      <!-- A real network unit: AdSense or Ad Manager loads its own script
           and fills this itself. We do not draw the creative, count the
           impression, or decide whether it can be skipped - the network does
           all three, and its reported revenue is the figure that gets paid.
           This used to be an empty div that loaded nothing, so a network ad
           showed a blank frame and earned nothing. -->
      <app-ad-network-unit [ad]="advert" />
    }
  }
}
