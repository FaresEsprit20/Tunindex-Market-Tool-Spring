<span class="sym" [class]="'sym-' + kind() + ' size-' + size()" aria-hidden="true">
  @switch (kind()) {
    @case ('gold') {
      <!-- A bullion bar reads as metal instantly; a coin reads as money. -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
        <path d="M4 17h16l-1.6-5H5.6L4 17z" />
        <path d="M7.2 12l1-3h7.6l1 3" />
      </svg>
    }
    @case ('silver') {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
        <path d="M4 17h16l-1.6-5H5.6L4 17z" />
        <path d="M7.2 12l1-3h7.6l1 3" />
      </svg>
    }
    @case ('crypto') {
      <span class="letter" [style.background]="cryptoTone()">{{ cryptoLetter() }}</span>
    }
    @case ('currency') {
      <span class="glyph">{{ currencyGlyph() }}</span>
    }
    @case ('rate') {
      <!-- A percent sign on a bank-ish plinth: the policy rate. -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M7 17L17 7" />
        <circle cx="8" cy="8" r="2.1" />
        <circle cx="16" cy="16" r="2.1" />
      </svg>
    }
    @case ('inflation') {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 16l5-5 3.5 3.5L20 7" />
        <path d="M15 7h5v5" />
      </svg>
    }
    @case ('growth') {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
        <path d="M5 19V11" /><path d="M12 19V5" /><path d="M19 19v-6" />
      </svg>
    }
    @default {
      <span class="glyph small">{{ initials() }}</span>
    }
  }
</span>
