<nav class="nav-strip" aria-label="Primary">
  @for (item of navItems; track item.route) {
    <a
      class="nav-link"
      [routerLink]="item.route"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path [attr.d]="item.icon"></path>
      </svg>
      <span>{{ item.label }}</span>
    </a>
  }

  <span class="nav-spacer"></span>

  <a class="nav-account" routerLink="/app/account" routerLinkActive="active">
    <span class="account-avatar">{{ (currentUser()?.email ?? '?').charAt(0).toUpperCase() }}</span>
    <span class="account-email">{{ currentUser()?.email ?? 'Account' }}</span>
  </a>
  <button type="button" class="nav-logout" (click)="logout()" aria-label="Sign out">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="M16 17l5-5-5-5"></path><path d="M21 12H9"></path></svg>
  </button>
</nav>
