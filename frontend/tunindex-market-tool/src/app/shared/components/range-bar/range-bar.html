@if (pct(); as p) {
  <div class="range-bar" [class.compact]="compact()">
    <div class="range-track">
      <div class="range-fill" [style.width.%]="p"></div>
      <div class="range-marker" [style.left.%]="p"></div>
    </div>
    @if (!compact()) {
      <div class="range-labels">
        <span>{{ minLabel() }}</span>
        <span>{{ maxLabel() }}</span>
      </div>
    }
  </div>
} @else {
  <div class="range-bar" [class.compact]="compact()">
    <div class="range-track empty"></div>
  </div>
}
