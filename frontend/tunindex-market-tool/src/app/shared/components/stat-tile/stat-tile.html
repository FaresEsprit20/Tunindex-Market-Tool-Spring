<span class="stat-label">{{ label() }}</span>
<span class="stat-value">{{ value() }}</span>
@if (trend()) {
  <span class="stat-trend" [class.up]="trend() === 'up'" [class.down]="trend() === 'down'">
    @if (trend() === 'up') {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12l7 7 7-7"></path></svg>
    }
    {{ trendLabel() }}
  </span>
}
