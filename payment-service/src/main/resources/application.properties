# ========================
# PAYMENT SERVICE CONFIGURATION
# ========================
spring.application.name=payment-service
server.port=8087

# ========================
# DATABASE
# ========================
spring.datasource.url=jdbc:postgresql://localhost:5432/tunindex-payment
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================
# Eureka Service Discovery
# ========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# ========================
# Internal API Key
# ========================
internal.api.key=market-tool-internal-secret-key-2026

# ========================
# API Service URL
# ========================
api.service.url=http://api-service

# ========================
# Konnect Payment Configuration (Tunisian Payment Gateway)
# ========================
konnect.api.url=https://api.konnect.network/v1
konnect.api.key=${KONNECT_API_KEY:test_key_123456}
konnect.webhook.secret=${KONNECT_WEBHOOK_SECRET:webhook_secret_123456}

# ========================
# Payment Settings
# ========================
payment.currency=TND
payment.success-redirect-url=http://localhost:4200/payment/success
payment.cancel-redirect-url=http://localhost:4200/payment/cancel
payment.webhook-url=http://localhost:8087/internal/payment/webhook/konnect

# ========================
# Subscription Plans
# ========================
subscription.plans.basic.price-monthly=9.99
subscription.plans.basic.price-yearly=99.99
subscription.plans.basic.api-calls-limit=1000
subscription.plans.basic.features=Basic stock data, Email support

subscription.plans.pro.price-monthly=29.99
subscription.plans.pro.price-yearly=299.99
subscription.plans.pro.api-calls-limit=10000
subscription.plans.pro.features=Advanced stock data, Graham calculator, Priority support, API access

subscription.plans.enterprise.price-monthly=99.99
subscription.plans.enterprise.price-yearly=999.99
subscription.plans.enterprise.api-calls-limit=100000
subscription.plans.enterprise.features=All Pro features, Dedicated support, Custom integration, SLA guarantee

# ========================
# Logging
# ========================
logging.level.com.tunindex.market_tool.payment=DEBUG
logging.level.org.springframework.web.reactive.function.client=DEBUG

# ========================
# Swagger
# ========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html