# ========================
# PAYMENT SERVICE CONFIGURATION
# ========================
spring.application.name=user-susbscription-service
server.port=8089

# Mailing service URL
mailing.service.url=http://mailing-service
# ========================
# DATABASE
# ========================
spring.datasource.url=jdbc:postgresql://localhost:5432/tunindex-user-subscription
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================
# Eureka Service Discovery
# ========================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# ========================
# Internal API Key
# ========================
internal.api.key=market-tool-internal-secret-key-2026

# ========================
# API Service URL
# ========================
api.service.url=http://api-service



# ========================
# Subscription Plans Configuration
# ========================
subscription.plans.basic.id=1
subscription.plans.basic.name=BASIC
subscription.plans.basic.price-monthly=9.99
subscription.plans.basic.price-yearly=99.99
subscription.plans.basic.api-calls-limit=1000
subscription.plans.basic.features=Basic stock data, Email support

subscription.plans.pro.id=2
subscription.plans.pro.name=PRO
subscription.plans.pro.price-monthly=29.99
subscription.plans.pro.price-yearly=299.99
subscription.plans.pro.api-calls-limit=10000
subscription.plans.pro.features=Advanced stock data, Graham calculator, Priority support, API access

subscription.plans.enterprise.id=3
subscription.plans.enterprise.name=ENTERPRISE
subscription.plans.enterprise.price-monthly=99.99
subscription.plans.enterprise.price-yearly=999.99
subscription.plans.enterprise.api-calls-limit=100000
subscription.plans.enterprise.features=All Pro features, Dedicated support, Custom integration, SLA guarantee

# ========================
# Logging
# ========================
logging.level.com.tunindex.market_tool.payment=DEBUG
logging.level.org.springframework.web.reactive.function.client=DEBUG
logging.level.com.konnect=INFO

# ========================
# Swagger
# ========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true